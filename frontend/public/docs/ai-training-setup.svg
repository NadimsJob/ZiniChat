<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <style>
      .bg-app { fill: #090d16; }
      .bg-card { fill: #121827; stroke: #1f293d; stroke-width: 1; }
      .text-white { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      .text-muted { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      .text-green { fill: #34d399; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      .text-orange { fill: #fb923c; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F824A"/>
      <stop offset="100%" stop-color="#145932"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE8D27"/>
      <stop offset="100%" stop-color="#C76B13"/>
    </linearGradient>
  </defs>

  <rect width="920" height="540" rx="16" fill="#090d16"/>
  <rect width="918" height="538" x="1" y="1" rx="15" fill="none" stroke="#26334d" stroke-width="1"/>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="920" height="42" fill="#121827"/>
  <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5.5" fill="#10b981"/>
  <text x="460" y="26" text-anchor="middle" class="text-muted" font-size="12" font-weight="600">ZiniChat — Settings &gt; AI Training &amp; Knowledge Base</text>

  <!-- Banner -->
  <rect x="30" y="55" width="860" height="45" rx="10" fill="#064e3b" fill-opacity="0.3" stroke="#059669" stroke-opacity="0.4"/>
  <text x="50" y="82" class="text-white" font-size="13" font-weight="700">AI Assistant Settings &amp; Training Guide (AI Persona &amp; Q&amp;A Setup)</text>

  <!-- Left Box: AI System Prompt Persona -->
  <rect x="30" y="112" width="410" height="400" rx="14" class="bg-card"/>
  <text x="50" y="140" class="text-white" font-size="15" font-weight="700">1. AI Persona &amp; System Prompt Instructions</text>
  <text x="50" y="158" class="text-muted" font-size="11">Describe your brand voice, tone, guidelines, and customer greeting rules.</text>

  <rect x="50" y="172" width="370" height="235" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="65" y="197" fill="#a7f3d0" font-family="monospace" font-size="12">You are ZiniBot, smart sales assistant for Demo Store.</text>
  <text x="65" y="222" fill="#e2e8f0" font-family="monospace" font-size="12">1. Greet customers warmly with "Hello! Welcome to Demo Store".</text>
  <text x="65" y="247" fill="#e2e8f0" font-family="monospace" font-size="12">2. Answer questions accurately using catalog items &amp; Q&amp;A base.</text>
  <text x="65" y="272" fill="#e2e8f0" font-family="monospace" font-size="12">3. Ask for Name, Address, &amp; Phone Number when placing an order.</text>
  <text x="65" y="297" fill="#e2e8f0" font-family="monospace" font-size="12">4. Maintain a polite, professional, and helpful conversation tone.</text>
  <text x="65" y="322" fill="#94a3b8" font-family="monospace" font-size="11">5. Standard delivery timeframe: 24-48 hours nationwide.</text>

  <rect x="50" y="420" width="370" height="38" rx="10" fill="url(#primaryGrad)"/>
  <text x="235" y="444" text-anchor="middle" class="text-white" font-size="13" font-weight="700">💾 Save AI Settings</text>

  <rect x="50" y="468" width="370" height="30" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3"/>
  <text x="235" y="487" text-anchor="middle" class="text-green" font-size="11" font-weight="600">✓ AI Auto-Reply is active on Live Inbox</text>

  <!-- Right Box: Quick Q&A Knowledge Base -->
  <rect x="460" y="112" width="430" height="240" rx="14" class="bg-card"/>
  <text x="480" y="140" class="text-white" font-size="15" font-weight="700">2. Quick Q&amp;A Knowledge Base</text>
  <text x="480" y="158" class="text-muted" font-size="11">Add instant answers for frequently asked customer questions.</text>

  <rect x="480" y="172" width="390" height="65" rx="10" fill="#1f293d" stroke="#374151"/>
  <text x="495" y="194" class="text-orange" font-size="12" font-weight="700">Q: What is your shipping &amp; delivery charge?</text>
  <text x="495" y="214" class="text-white" font-size="12">A: Inside Dhaka ৳ 70 BDT, Outside Dhaka ৳ 120 BDT.</text>
  <text x="495" y="228" class="text-muted" font-size="10">Tags: delivery, charge, shipping</text>

  <rect x="480" y="247" width="390" height="65" rx="10" fill="#1f293d" stroke="#374151"/>
  <text x="495" y="269" class="text-orange" font-size="12" font-weight="700">Q: What is your item return policy?</text>
  <text x="495" y="289" class="text-white" font-size="12">A: Returns accepted within 3 days of parcel delivery.</text>
  <text x="495" y="303" class="text-muted" font-size="10">Tags: return, policy, refund</text>

  <rect x="480" y="320" width="185" height="26" rx="8" fill="url(#orangeGrad)"/>
  <text x="572" y="337" text-anchor="middle" class="text-white" font-size="11" font-weight="700">+ Add New Q&amp;A</text>

  <rect x="675" y="320" width="195" height="26" rx="8" fill="#374151"/>
  <text x="772" y="337" text-anchor="middle" class="text-muted" font-size="11" font-weight="600">⚡ Import Preset Q&amp;As</text>

  <!-- Right Bottom Box: AI Live Simulator Agent -->
  <rect x="460" y="362" width="430" height="150" rx="14" class="bg-card"/>
  <text x="480" y="385" class="text-white" font-size="14" font-weight="700">🤖 AI Live Test Simulator</text>
  
  <!-- Chat bubble 1 -->
  <rect x="480" y="398" width="210" height="28" rx="8" fill="#1f293d"/>
  <text x="492" y="416" class="text-white" font-size="11">What is your item return policy?</text>

  <!-- AI Reply bubble -->
  <rect x="580" y="432" width="290" height="36" rx="8" fill="url(#primaryGrad)"/>
  <text x="592" y="454" class="text-white" font-size="11">Returns accepted within 3 days of parcel delivery.</text>

  <!-- Input -->
  <rect x="480" y="475" width="390" height="28" rx="14" fill="#1f293d" stroke="#374151"/>
  <text x="495" y="493" class="text-muted" font-size="11">Type test message here...</text>
</svg>
