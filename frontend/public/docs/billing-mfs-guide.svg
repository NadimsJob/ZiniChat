  <text x="470" y="115" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">Submit Payment Transaction ID (TrxID)</text>
  <text x="470" y="135" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Instant activation via automated MFS transaction check</text>

  <text x="470" y="180" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Selected Plan: Growth (Monthly)</text>
  <text x="470" y="200" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Amount: ৳ 1,990 BDT</text>

  <rect x="470" y="225" width="370" height="42" rx="8" fill="#1f293d" stroke="#374151"/>
  <text x="485" y="251" fill="#94a3b8" font-family="monospace" font-size="13">TrxID: BKH9827361A</text>

  <rect x="470" y="285" width="370" height="40" rx="8" fill="url(#bkashGrad)"/>
  <text x="655" y="310" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Claim Payment &amp; Activate Plan</text>

  <rect x="470" y="340" width="370" height="36" rx="8" fill="#10b981" fill-opacity="0.15"/>
  <text x="655" y="363" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">✓ Instant Automatic Subscription Renewal</text>
