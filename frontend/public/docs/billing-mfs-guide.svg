  <text x="40" y="47" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Billing &amp; Instant bKash / Nagad / Rocket MFS Checkout</text>

  <!-- Left Side: EMVCo Bangla QR -->
  <rect x="40" y="85" width="380" height="365" rx="12" fill="#111827" stroke="#374151"/>
  <rect x="60" y="105" width="340" height="45" rx="8" fill="url(#bkashGrad)"/>
  <text x="230" y="133" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">bKash / Nagad Bangla QR</text>

  <!-- QR Visual Box -->
  <rect x="130" y="165" width="200" height="200" rx="12" fill="#ffffff" stroke="#e2136e" stroke-width="3"/>
  <!-- Simulated QR inner elements -->
  <rect x="145" y="180" width="45" height="45" fill="#000000"/>
  <rect x="153" y="188" width="29" height="29" fill="#ffffff"/>
  <rect x="161" y="196" width="13" height="13" fill="#000000"/>

  <rect x="270" y="180" width="45" height="45" fill="#000000"/>
  <rect x="278" y="188" width="29" height="29" fill="#ffffff"/>
  <rect x="286" y="196" width="13" height="13" fill="#000000"/>

  <rect x="145" y="305" width="45" height="45" fill="#000000"/>
  <rect x="153" y="313" width="29" height="29" fill="#ffffff"/>
  <rect x="161" y="321" width="13" height="13" fill="#000000"/>

  <!-- Center bKash icon overlay -->
  <circle cx="230" cy="265" r="22" fill="#e2136e"/>
  <text x="230" y="271" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="900">৳</text>

  <text x="230" y="390" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Scan with bKash / Nagad App</text>

  <!-- Right Side: Claim Transaction -->
