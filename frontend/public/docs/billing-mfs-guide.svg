<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <style>
      .bg-app { fill: #090d16; }
      .bg-card { fill: #121827; stroke: #1f293d; stroke-width: 1; }
      .text-white { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      .text-muted { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      .text-green { fill: #34d399; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
    <linearGradient id="bkashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2136e"/>
      <stop offset="100%" stop-color="#9a0847"/>
    </linearGradient>
  </defs>

  <rect width="920" height="540" rx="16" fill="#090d16"/>
  <rect width="918" height="538" x="1" y="1" rx="15" fill="none" stroke="#26334d" stroke-width="1"/>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="920" height="42" fill="#121827"/>
  <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5.5" fill="#10b981"/>
  <text x="460" y="26" text-anchor="middle" class="text-muted" font-size="12" font-weight="600">ZiniChat — bKash / Nagad EMVCo Bangla QR Checkout (বাংলা কিউআর পেমেন্ট)</text>

  <!-- Left Side: EMVCo Bangla QR Code -->
  <rect x="30" y="60" width="410" height="450" rx="14" class="bg-card"/>
  <rect x="50" y="80" width="370" height="48" rx="10" fill="url(#bkashGrad)"/>
  <text x="235" y="109" text-anchor="middle" class="text-white" font-size="16" font-weight="700">bKash / Nagad Bangla QR Code</text>

  <!-- QR Display Frame -->
  <rect x="115" y="150" width="240" height="240" rx="16" fill="#ffffff" stroke="#e2136e" stroke-width="3"/>
  <rect x="135" y="170" width="55" height="55" fill="#000000"/>
  <rect x="145" y="180" width="35" height="35" fill="#ffffff"/>
  <rect x="155" y="190" width="15" height="15" fill="#000000"/>

  <rect x="280" y="170" width="55" height="55" fill="#000000"/>
  <rect x="290" y="180" width="35" height="35" fill="#ffffff"/>
  <rect x="300" y="190" width="15" height="15" fill="#000000"/>

  <rect x="135" y="315" width="55" height="55" fill="#000000"/>
  <rect x="145" y="325" width="35" height="35" fill="#ffffff"/>
  <rect x="155" y="335" width="15" height="15" fill="#000000"/>

  <circle cx="235" cy="270" r="26" fill="#e2136e"/>
  <text x="235" y="278" text-anchor="middle" class="text-white" font-size="18" font-weight="900">৳</text>

  <text x="235" y="418" text-anchor="middle" class="text-muted" font-size="12">bKash বা Nagad অ্যাপ দিয়ে স্ক্রিনের QR কোড স্ক্যান করুন</text>

  <!-- Right Side: Plan details & Claim Form -->
  <rect x="460" y="60" width="430" height="450" rx="14" class="bg-card"/>
  <text x="480" y="95" class="text-white" font-size="16" font-weight="700">Payment Summary &amp; TrxID Claim</text>

  <rect x="480" y="115" width="390" height="85" rx="10" fill="#18181b" stroke="#27272a"/>
  <text x="500" y="142" class="text-muted" font-size="12">Selected Plan: <tspan fill="#ffffff" font-weight="700">Growth (Monthly)</tspan></text>
  <text x="500" y="165" class="text-muted" font-size="12">Billing Cycle: <tspan fill="#ffffff" font-weight="700">30 Days Auto-Reset</tspan></text>
  <text x="500" y="188" class="text-green" font-size="15" font-weight="700">Total BDT: ৳ ১,৯৯০ BDT</text>

  <text x="480" y="235" class="text-white" font-size="13" font-weight="700">Enter Transaction ID (TrxID):</text>
  <rect x="480" y="250" width="390" height="44" rx="10" fill="#18181b" stroke="#374151"/>
  <text x="500" y="277" fill="#facc15" font-family="monospace" font-size="14" font-weight="700">TrxID: BKH9827361A</text>

  <rect x="480" y="315" width="390" height="44" rx="10" fill="url(#bkashGrad)"/>
  <text x="675" y="342" text-anchor="middle" class="text-white" font-size="14" font-weight="700">Claim Payment &amp; Activate Plan</text>

  <rect x="480" y="380" width="390" height="40" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3"/>
  <text x="675" y="405" text-anchor="middle" class="text-green" font-size="12" font-weight="600">✓ Instant Automatic Subscription Renewal</text>
</svg>
