<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <style>
      .bg-app { fill: #090d16; }
      .bg-card { fill: #121827; stroke: #1f293d; stroke-width: 1; }
      .bg-header { fill: #161e2e; stroke: #26334d; stroke-width: 1; }
      .text-white { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .text-muted { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .text-green { fill: #34d399; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .btn-primary-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; }
    </style>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F824A"/>
      <stop offset="100%" stop-color="#145932"/>
    </linearGradient>
  </defs>

  <!-- Outer Dashboard Window Frame -->
  <rect width="920" height="540" rx="16" fill="#090d16"/>
  <rect width="918" height="538" x="1" y="1" rx="15" fill="none" stroke="#26334d" stroke-width="1"/>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="920" height="42" fill="#121827"/>
  <line x1="0" y1="42" x2="920" y2="42" stroke="#1f293d" stroke-width="1"/>
  <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5.5" fill="#10b981"/>
  <text x="460" y="26" text-anchor="middle" class="text-muted" font-size="12" font-weight="600">ZiniChat Dashboard — Connected Inboxes</text>

  <!-- Page Header Card -->
  <rect x="30" y="60" width="860" height="68" rx="14" class="bg-header"/>
  <text x="50" y="92" class="text-white" font-size="18" font-weight="700">Connected Inboxes</text>
  <text x="50" y="112" class="text-muted" font-size="12">Manage active communication channels (WhatsApp, Messenger, Instagram, Website Widgets) and check AI auto-reply status.</text>
  
  <rect x="735" y="78" width="135" height="34" rx="10" fill="url(#primaryGrad)"/>
  <text x="802" y="100" text-anchor="middle" class="btn-primary-text">+ Add Inbox</text>

  <!-- Instruction Banner (Emerald) -->
  <rect x="30" y="140" width="860" height="50" rx="12" fill="#064e3b" fill-opacity="0.25" stroke="#059669" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="55" cy="165" r="12" fill="#10b981" fill-opacity="0.2"/>
  <path d="M50 165h10M55 160v10" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <text x="78" y="162" class="text-white" font-size="13" font-weight="700">Inbox Connection Status Guide</text>
  <text x="78" y="177" class="text-green" font-size="11">A green "Active" badge indicates the channel is fully connected and ready to send &amp; receive customer messages.</text>

  <!-- Inbox Channel Card 1: Meta Facebook Page & Instagram -->
  <rect x="30" y="205" width="860" height="92" rx="14" class="bg-card"/>
  <rect x="50" y="225" width="52" height="52" rx="12" fill="#1877f2" fill-opacity="0.15" stroke="#1877f2" stroke-opacity="0.4"/>
  <path d="M76 241c0-4.4 3.6-8 8-8s8 3.6 8 8c0 4-2.9 7.3-6.8 7.9v-5.6h2.2l.4-2.3h-2.6v-1.5c0-.6.3-1.3 1.3-1.3h1.4v-2s-1.3-.2-2.6-.2c-2.6 0-4.3 1.6-4.3 4.5v1.6h-2v2.3h2v5.6C78.9 248.3 76 245 76 241z" fill="#1877f2"/>
  <text x="115" y="247" class="text-white" font-size="15" font-weight="700">Meta Facebook Page &amp; Instagram DM</text>
  <text x="115" y="267" class="text-muted" font-size="12">ID: page_109283741 • Connected via Official Meta Graph API</text>

  <rect x="420" y="239" width="70" height="24" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.4"/>
  <circle cx="433" cy="251" r="3.5" fill="#34d399"/>
  <text x="444" y="255" class="text-green" font-size="11" font-weight="700">Active</text>

  <rect x="500" y="239" width="145" height="24" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="572" y="255" text-anchor="middle" class="text-green" font-size="11" font-weight="700">🤖 AI Auto-Reply ON</text>

  <rect x="655" y="239" width="135" height="24" rx="12" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-opacity="0.4"/>
  <text x="722" y="255" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">✓ Official Meta Partner</text>

  <rect x="805" y="239" width="30" height="24" rx="6" fill="#1f293d"/>
  <text x="820" y="255" text-anchor="middle" fill="#94a3b8" font-size="11">✏️</text>
  <rect x="845" y="239" width="30" height="24" rx="6" fill="#ef4444" fill-opacity="0.15"/>
  <text x="860" y="255" text-anchor="middle" fill="#f87171" font-size="11">🗑️</text>

  <!-- Inbox Channel Card 2: WhatsApp Web Baileys / Cloud API -->
  <rect x="30" y="310" width="860" height="92" rx="14" class="bg-card"/>
  <rect x="50" y="330" width="52" height="52" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
  <path d="M76 346c0 4.4 3.6 8 8 8 1.4 0 2.7-.4 3.9-1l4.1 1.1-1.1-4c.7-1.2 1.1-2.6 1.1-4.1 0-4.4-3.6-8-8-8s-8 3.6-8 8z" fill="#10b981"/>
  <text x="115" y="352" class="text-white" font-size="15" font-weight="700">WhatsApp Business (+8801700000000)</text>
  <text x="115" y="372" class="text-muted" font-size="12">Baileys Web Engine • Linked Device Active</text>

  <rect x="420" y="344" width="70" height="24" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.4"/>
  <circle cx="433" cy="356" r="3.5" fill="#34d399"/>
  <text x="444" y="360" class="text-green" font-size="11" font-weight="700">Active</text>

  <rect x="500" y="344" width="145" height="24" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="572" y="360" text-anchor="middle" class="text-green" font-size="11" font-weight="700">🤖 AI Auto-Reply ON</text>

  <rect x="655" y="344" width="135" height="24" rx="12" fill="#10b981" fill-opacity="0.15"/>
  <text x="722" y="360" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">✓ Session Reconnected</text>

  <rect x="805" y="344" width="30" height="24" rx="6" fill="#1f293d"/>
  <text x="820" y="360" text-anchor="middle" fill="#94a3b8" font-size="11">✏️</text>
  <rect x="845" y="344" width="30" height="24" rx="6" fill="#ef4444" fill-opacity="0.15"/>
  <text x="860" y="360" text-anchor="middle" fill="#f87171" font-size="11">🗑️</text>

  <!-- Inbox Channel Card 3: Live Chat Website Widget -->
  <rect x="30" y="415" width="860" height="92" rx="14" class="bg-card"/>
  <rect x="50" y="435" width="52" height="52" rx="12" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.4"/>
  <path d="M74 451h20v14H74z" fill="#8b5cf6"/>
  <text x="115" y="457" class="text-white" font-size="15" font-weight="700">Live Chat Web Widget (ZiniChat Widget)</text>
  <text x="115" y="477" class="text-muted" font-size="12">Embed Script SDK • Installed on website store</text>

  <rect x="420" y="449" width="70" height="24" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.4"/>
  <circle cx="433" cy="461" r="3.5" fill="#34d399"/>
  <text x="444" y="465" class="text-green" font-size="11" font-weight="700">Active</text>

  <rect x="500" y="449" width="145" height="24" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="572" y="465" text-anchor="middle" class="text-green" font-size="11" font-weight="700">🤖 AI Auto-Reply ON</text>

  <rect x="655" y="449" width="135" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-opacity="0.4"/>
  <text x="722" y="465" text-anchor="middle" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">⚙️ Embed Code</text>

  <rect x="805" y="449" width="30" height="24" rx="6" fill="#1f293d"/>
  <text x="820" y="465" text-anchor="middle" fill="#94a3b8" font-size="11">✏️</text>
  <rect x="845" y="449" width="30" height="24" rx="6" fill="#ef4444" fill-opacity="0.15"/>
  <text x="860" y="465" text-anchor="middle" fill="#f87171" font-size="11">🗑️</text>
</svg>
