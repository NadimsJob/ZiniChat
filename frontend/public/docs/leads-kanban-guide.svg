  <rect x="42" y="166" width="246" height="85" rx="10" fill="#1f293d"/>
  <text x="58" y="190" class="text-white" font-size="13" font-weight="700">Nadim Hasan</text>
  <text x="58" y="210" class="text-muted" font-size="11">WhatsApp • Leather Jacket Inquiry</text>
  <text x="58" y="230" class="text-green" font-size="12" font-weight="700">Value: ৳ ২,৪৫০ BDT</text>

