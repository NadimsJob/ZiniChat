<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .bg-app { fill: #090d16; }
      .bg-card { fill: #121827; stroke: #1f293d; stroke-width: 1; }
      .text-white { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .text-muted { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .text-green { fill: #1F824A; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .text-orange { fill: #EE8D27; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F824A"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#EE8D27"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="560" rx="16" fill="#090d16"/>
  <rect width="958" height="558" x="1" y="1" rx="15" fill="none" stroke="#26334d" stroke-width="1"/>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="960" height="44" fill="#121827" rx="16"/>
  <rect x="0" y="30" width="960" height="14" fill="#121827"/>
  <circle cx="24" cy="22" r="5.5" fill="#ef4444"/>
  <circle cx="40" cy="22" r="5.5" fill="#f59e0b"/>
  <circle cx="56" cy="22" r="5.5" fill="#10b981"/>
  <text x="480" y="27" text-anchor="middle" class="text-white" font-size="13" font-weight="700">Zini-Mail — Autonomous AI Cold Email Outreach &amp; Lead Generation Lifecycle</text>

  <!-- Step 1: SMTP Hub & Verification -->
  <rect x="30" y="64" width="210" height="230" rx="12" class="bg-card"/>
  <rect x="30" y="64" width="210" height="34" rx="12" fill="#1e293b"/>
  <rect x="30" y="86" width="210" height="12" fill="#1e293b"/>
  <circle cx="50" cy="81" r="9" fill="#10b981"/>
  <text x="50" y="85" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">1</text>
  <text x="70" y="85" class="text-white" font-size="12" font-weight="700">Custom SMTP Hub</text>
  <text x="45" y="122" class="text-white" font-size="11" font-weight="600">Google / cPanel Mail</text>
  <text x="45" y="140" class="text-muted" font-size="10">• Real-Time SMTP Handshake</text>
  <text x="45" y="156" class="text-muted" font-size="10">• SPF &amp; DKIM Domain Check</text>
  <text x="45" y="172" class="text-muted" font-size="10">• Live Test Ping Verification</text>
  <rect x="45" y="200" width="180" height="28" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="135" y="218" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="700">✓ SMTP Handshake Passed</text>
  <text x="45" y="254" class="text-muted" font-size="9">Rate limit: 100-300 / day</text>

  <!-- Step 2: Multi-Channel Lead Harvester -->
  <rect x="255" y="64" width="215" height="230" rx="12" class="bg-card"/>
  <rect x="255" y="64" width="215" height="34" rx="12" fill="#1e293b"/>
  <rect x="255" y="86" width="215" height="12" fill="#1e293b"/>
  <circle cx="275" cy="81" r="9" fill="#3b82f6"/>
  <text x="275" y="85" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">2</text>
  <text x="295" y="85" class="text-white" font-size="12" font-weight="700">SERP &amp; Lead Harvester</text>
  <text x="270" y="122" class="text-white" font-size="11" font-weight="600">Multi-Channel Discovery</text>
  <text x="270" y="140" class="text-muted" font-size="10">• Google SerpAPI &amp; YellowPages</text>
  <text x="270" y="156" class="text-muted" font-size="10">• B2B Prospect Domain Crawl</text>
  <text x="270" y="172" class="text-muted" font-size="10">• No-Email Phone Harvester</text>
  <rect x="270" y="196" width="185" height="36" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="280" y="211" fill="#a5b4fc" font-size="9" font-weight="700">Email Leads: Email Queue</text>
  <text x="280" y="224" fill="#fbbf24" font-size="9" font-weight="700">Phone-Only: WA Broadcast Hub</text>
  <text x="270" y="254" class="text-muted" font-size="9">Physical Storage: Quota Metered</text>

  <!-- Step 3: AI Vision Drafter & Prompt Caching -->
  <rect x="485" y="64" width="220" height="230" rx="12" class="bg-card"/>
  <rect x="485" y="64" width="220" height="34" rx="12" fill="#1e293b"/>
  <rect x="485" y="86" width="220" height="12" fill="#1e293b"/>
  <circle cx="505" cy="81" r="9" fill="#8b5cf6"/>
  <text x="505" y="85" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">3</text>
  <text x="525" y="85" class="text-white" font-size="12" font-weight="700">AI Vision Copy Drafter</text>
  <text x="500" y="122" class="text-white" font-size="11" font-weight="600">Visual Card &amp; Tone Styling</text>
  <text x="500" y="140" class="text-muted" font-size="10">• Hero Banner OCR Extraction</text>
  <text x="500" y="156" class="text-muted" font-size="10">• 6 Professional Tone Presets</text>
  <text x="500" y="172" class="text-muted" font-size="10">• Prompt Caching Architecture</text>
  <rect x="500" y="200" width="190" height="28" rx="6" fill="#3b0764" stroke="#7e22ce" stroke-width="1"/>
  <text x="595" y="218" text-anchor="middle" fill="#e9d5ff" font-size="10" font-weight="700">Multi-Lang: EN, BN, Banglish</text>
  <text x="500" y="254" class="text-muted" font-size="9">Saga: 1 AI Unit / Delivered Email</text>

  <!-- Step 4: Throttled Dispatcher & Jitter Queue -->
  <rect x="720" y="64" width="210" height="230" rx="12" class="bg-card"/>
  <rect x="720" y="64" width="210" height="34" rx="12" fill="#1e293b"/>
  <rect x="720" y="86" width="210" height="12" fill="#1e293b"/>
  <circle cx="740" cy="81" r="9" fill="#ec4899"/>
  <text x="740" y="85" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">4</text>
  <text x="760" y="85" class="text-white" font-size="12" font-weight="700">Safe BullMQ Queue</text>
  <text x="735" y="122" class="text-white" font-size="11" font-weight="600">Reputation Armor</text>
  <text x="735" y="140" class="text-muted" font-size="10">• 1 Email / Min Strict Delay</text>
  <text x="735" y="156" class="text-muted" font-size="10">• +0-15s Organic Jitter</text>
  <text x="735" y="172" class="text-muted" font-size="10">• Bounce Rate Auto-Tripwire (&gt;8%)</text>
  <rect x="735" y="200" width="180" height="28" rx="6" fill="#4c0519" stroke="#be123c" stroke-width="1"/>
  <text x="825" y="218" text-anchor="middle" fill="#fecdd3" font-size="10" font-weight="700">Master Emergency Kill-Switch</text>
  <text x="735" y="254" class="text-muted" font-size="9">Zero-Spam Domain Protection</text>

  <!-- Horizontal Connection Line -->
  <line x1="135" y1="315" x2="825" y2="315" stroke="#334155" stroke-dasharray="6,6" stroke-width="2"/>

  <!-- Step 5: Attribution Telemetry & Conversion Engine -->
  <rect x="30" y="325" width="440" height="210" rx="12" class="bg-card"/>
  <rect x="30" y="325" width="440" height="34" rx="12" fill="#1e293b"/>
  <rect x="30" y="347" width="440" height="12" fill="#1e293b"/>
  <circle cx="50" cy="342" r="9" fill="#10b981"/>
  <text x="50" y="346" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">5</text>
  <text x="70" y="346" class="text-white" font-size="12" font-weight="700">Full-Funnel Attribution &amp; Conversion Tracking</text>

  <rect x="45" y="375" width="190" height="60" rx="8" fill="#1e293b"/>
  <text x="55" y="395" fill="#38bdf8" font-size="11" font-weight="700">42-Byte 1x1 Open Pixel</text>
  <text x="55" y="412" class="text-muted" font-size="10">Pixel loads /track/open/:token</text>
  <text x="55" y="426" class="text-muted" font-size="10">Records exact opens &amp; timestamp</text>

  <rect x="250" y="375" width="205" height="60" rx="8" fill="#1e293b"/>
  <text x="260" y="395" fill="#a78bfa" font-size="11" font-weight="700">Smart Click Redirect</text>
  <text x="260" y="412" class="text-muted" font-size="10">Wraps URL with 30-day cookie</text>
  <text x="260" y="426" class="text-muted" font-size="10">Injects UTM params to catalog</text>

  <rect x="45" y="445" width="410" height="42" rx="8" fill="#042f2e" stroke="#0d9488" stroke-width="1"/>
  <text x="55" y="463" fill="#5eead4" font-size="11" font-weight="700">🎯 Atomic Order Hook in Checkout</text>
  <text x="55" y="477" class="text-muted" font-size="10">When cookie matches, order &amp; GMV are attributed directly to campaign revenue</text>
  <text x="45" y="515" class="text-muted" font-size="9">CAN-SPAM Compliant: Instant 1-Click Unsubscribe &amp; Global Suppression Sync</text>

  <!-- Step 6: 1-Click Retargeting Bar (The Big Finish) -->
  <rect x="485" y="325" width="445" height="210" rx="12" class="bg-card"/>
  <rect x="485" y="325" width="445" height="34" rx="12" fill="#1e293b"/>
  <rect x="485" y="347" width="445" height="12" fill="#1e293b"/>
  <circle cx="505" cy="342" r="9" fill="#f59e0b"/>
  <text x="505" y="346" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">6</text>
  <text x="525" y="346" class="text-white" font-size="12" font-weight="700">🔥 "Clicked (No Order Yet)" Precision Retargeting</text>

  <!-- Highlight Pill Graphic -->
  <rect x="500" y="372" width="230" height="28" rx="14" fill="#7c2d12" stroke="#ea580c" stroke-width="1.5"/>
  <text x="515" y="391" fill="#ffedd5" font-size="11" font-weight="800">🔥 Clicked (No Order Yet) [3]</text>

  <rect x="500" y="412" width="415" height="60" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="515" y="432" fill="#f97316" font-size="11" font-weight="700">1-Click High-Intent Actions:</text>
  <text x="515" y="450" class="text-muted" font-size="10">① Push to WhatsApp Broadcast Hub (/dashboard/broadcasts)</text>
  <text x="515" y="464" class="text-muted" font-size="10">② Auto-Tag CRM Contacts (Kanban Warm Lead stage)</text>

  <!-- Retargeting Buttons Simulation -->
  <rect x="500" y="482" width="200" height="30" rx="6" fill="#1F824A"/>
  <text x="600" y="501" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">📢 Push to WA Broadcast</text>

  <rect x="715" y="482" width="200" height="30" rx="6" fill="#334155"/>
  <text x="815" y="501" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">📥 Export Filtered CSV</text>
</svg>
